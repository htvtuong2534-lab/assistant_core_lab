[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "assistant-core"
version = "0.3.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.13,<3",
    "python-dotenv>=1.2,<2",
]
[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.17,<0.18",
]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]
ignore = ["UP045"]